<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 小说转剧本工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">比赛 Demo 项目</p>
      <h1>小说改编剧本工具</h1>
      <p>将章节整理为可编辑的剧本初稿</p>
    </div>
    <nav class="top-actions" aria-label="主要操作">
      <button type="button" class="btn primary" id="topLoadExampleBtn">加载示例</button>
      <button type="button" class="btn" id="parseChaptersBtn">识别章节</button>
      <button type="button" class="btn disabled-action" id="generateYamlBtn" aria-disabled="true">生成 YAML</button>
      <button type="button" class="btn disabled-action" id="cleanScriptBtn" aria-disabled="true">清洗为剧本</button>
      <button type="button" class="btn disabled-action" id="previewScriptBtn" aria-disabled="true">预览最终剧本</button>
    </nav>
  </header>

  <main class="workspace">
    <section class="panel input-panel" aria-labelledby="inputTitle">
      <div class="panel-heading">
        <div>
          <p class="section-kicker">Source</p>
          <h2 id="inputTitle">原文输入</h2>
        </div>
        <span class="word-count" id="wordCount">0 字</span>
      </div>

      <textarea id="novelInput" class="novel-input" placeholder="在这里粘贴小说文本"></textarea>

      <div class="input-actions">
        <label class="file-button" for="txtUpload">上传 txt 文件</label>
        <input type="file" id="txtUpload" accept=".txt,text/plain">
        <button type="button" class="btn secondary" id="panelLoadExampleBtn">加载示例</button>
        <button type="button" class="btn ghost" id="clearTextBtn">清空</button>
      </div>

      <div class="status-line info" id="inputStatus">等待输入小说文本</div>
    </section>

    <section class="panel control-panel" aria-labelledby="controlTitle">
      <div class="panel-heading">
        <div>
          <p class="section-kicker">Chapters</p>
          <h2 id="controlTitle">章节识别结果</h2>
        </div>
      </div>
      <div class="chapter-stats">
        <div class="stat-card">
          <span class="stat-label">识别章节数</span>
          <strong id="chapterCount">0</strong>
        </div>
        <div class="stat-card neutral" id="chapterRequirement">
          <span class="stat-label">状态</span>
          <strong id="chapterRequirementText">尚未识别章节</strong>
        </div>
      </div>
      <div class="chapter-message info" id="chapterMessage">输入小说文本后点击“识别章节”。</div>
      <div class="chapter-list" id="chapterList">
        <div class="empty-state">暂无章节结果</div>
      </div>
    </section>

    <section class="panel yaml-panel" aria-labelledby="yamlTitle">
      <div class="panel-heading">
        <div>
          <p class="section-kicker">Output</p>
          <h2 id="yamlTitle">YAML 与校验</h2>
        </div>
        <span class="validation-badge">未生成</span>
      </div>
      <p class="muted">生成 YAML、Schema 校验和下载功能将在后续 PR 中开放。</p>
      <textarea class="yaml-output" readonly disabled placeholder="YAML 输出占位"></textarea>
    </section>
  </main>

  <div class="modal-backdrop" id="previewModal" hidden>
    <div class="script-paper" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <button type="button" class="modal-close" id="closePreviewBtn" aria-label="关闭预览">×</button>
      <p class="section-kicker">Preview</p>
      <h2 id="previewTitle">最终剧本预览</h2>
      <p class="muted">该功能将在后续 PR 中实现。</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
