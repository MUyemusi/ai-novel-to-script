<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叙构 | 欢迎页</title>
  <link rel="stylesheet" href="styles.css?v=20260607f">
</head>
<body>
  <div class="welcome-shell">
    <header class="welcome-topbar">
      <div class="topbar-left">
        <button type="button" class="menu-toggle" id="openSidebarBtn" aria-label="切换记忆栏">☰</button>
        <span class="brand-mark">叙构</span>
      </div>
      <div class="topbar-center">叙构创作空间</div>
      <div class="topbar-right">
        <button type="button" class="ghost-chip">帮助</button>
        <button type="button" class="ghost-chip">设置</button>
        <label class="noise-control" for="noiseSelect">
          <span>环境音</span>
          <select id="noiseSelect" aria-label="环境音选择">
            <option value="off" selected>关闭</option>
            <option value="fireplace">篝火</option>
            <option value="rain">雨声</option>
          </select>
        </label>
      </div>
    </header>

    <main class="welcome-stage">
      <aside class="memory-sidebar" id="memorySidebar" aria-label="记忆侧栏">
        <div class="memory-sidebar-header">
          <h2>对话记忆</h2>
          <button type="button" class="icon-button" id="closeSidebarBtn" aria-label="收起记忆栏">−</button>
        </div>

        <div class="memory-list-wrapper">
          <div class="memory-list" id="memoryList"></div>
        </div>
      </aside>

      <section class="welcome-panel" id="welcomePanel">
        <canvas class="snow-canvas" id="snowCanvas" aria-hidden="true"></canvas>
        <div class="floating-orbs" aria-hidden="true">
          <span class="orb orb-one"></span>
          <span class="orb orb-two"></span>
          <span class="orb orb-three"></span>
          <span class="orb orb-four"></span>
        </div>
        <div class="welcome-copy">
          <h1 class="hero-title">欢迎来到 叙构</h1>
          <p>
            在这里，将章节的叙事转变为可编辑的剧本结构。<br>
            <span class="hero-subline">您可以加载示例、上传原文，开始您的创作之旅。</span>
          </p>
          <button type="button" class="start-button" id="startCreateBtn">开始创作 →</button>
        </div>

        <footer class="welcome-footer">叙构 ©2026 • 隐私政策 • 使用条款 • 服务协议</footer>
      </section>
    </main>
  </div>

  <div class="modal-backdrop notebook-modal-backdrop" id="createNotebookModal" hidden>
    <div class="notebook-modal-card" role="dialog" aria-modal="true" aria-labelledby="createNotebookModalTitle">
      <button type="button" class="modal-close notebook-modal-close" id="closeNotebookModalBtn" aria-label="关闭创建笔记本弹窗">×</button>
      <div class="notebook-modal-header">
        <p class="modal-kicker">Create</p>
        <h2 id="createNotebookModalTitle">创建新笔记本</h2>
      </div>

      <form class="notebook-modal-form" id="createNotebookForm">
        <label class="notebook-field-group" for="notebookTitleInput">
          <span class="notebook-field-label">笔记本名称</span>
          <input
            id="notebookTitleInput"
            name="title"
            type="text"
            maxlength="80"
            placeholder="例如：长篇世界观设定"
            required
          >
        </label>

        <label class="notebook-field-group" for="notebookDescriptionInput">
          <span class="notebook-field-label">笔记本说明</span>
          <textarea
            id="notebookDescriptionInput"
            name="description"
            rows="6"
            maxlength="240"
            placeholder="补充这个笔记本的用途、当前进度或写作方向。"
          ></textarea>
        </label>

        <p class="notebook-form-message" id="createNotebookMessage" hidden></p>

        <button type="submit" class="notebook-submit-btn" id="submitNotebookBtn">创建笔记本</button>
      </form>
    </div>
  </div>

  <script src="audio-player.js?v=20260607e"></script>
  <script src="app.js?v=20260607f"></script>
</body>
</html>
