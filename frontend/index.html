<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 小说转剧本工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <p class="eyebrow">比赛 Demo 项目</p>
      <h1>AI 小说转剧本工具</h1>
      <p class="intro">
        面向小说作者的改编辅助工具，后续将支持将 3 个章节以上的小说文本转换为结构化剧本 YAML 初稿。
      </p>
    </div>
  </header>

  <main class="page-shell">
    <section class="panel">
      <h2>小说输入区</h2>
      <textarea class="novel-input" placeholder="在后续 PR 中，这里将用于粘贴或上传小说文本。"></textarea>
    </section>

    <section class="panel">
      <h2>章节识别区</h2>
      <div class="placeholder-box">章节切分结果将在后续接口接入后展示。</div>
    </section>

    <section class="panel">
      <h2>剧本 YAML 生成区</h2>
      <div class="placeholder-box">剧本 YAML 生成功能将在后续 PR 中实现。</div>
    </section>

    <section class="panel">
      <h2>校验、预览与导出区</h2>
      <div class="placeholder-box">校验、预览与导出能力将在后续阶段补充。</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
