<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叙构 | 欢迎页</title>
  <link rel="stylesheet" href="styles.css?v=20260607c">
</head>
<body>
  <div class="welcome-shell">
    <header class="welcome-topbar">
      <div class="topbar-left">
        <button type="button" class="menu-toggle" id="openSidebarBtn" aria-label="切换记忆栏">☰</button>
        <span class="brand-mark">叙构</span>
      </div>
      <div class="topbar-center">叙构创作空间</div>
      <div class="topbar-right">
        <button type="button" class="ghost-chip">帮助</button>
        <button type="button" class="ghost-chip">设置</button>
        <label class="noise-control" for="noiseSelect">
          <span>环境音</span>
          <select id="noiseSelect" aria-label="环境音选择">
            <option value="白噪音">白噪音</option>
            <option value="雨声" selected>雨声</option>
            <option value="下雪">下雪</option>
          </select>
        </label>
      </div>
    </header>

    <main class="welcome-stage">
      <aside class="memory-sidebar" id="memorySidebar" aria-label="记忆侧栏">
        <div class="memory-sidebar-header">
          <h2>对话记忆</h2>
          <button type="button" class="icon-button" id="closeSidebarBtn" aria-label="收起记忆栏">−</button>
        </div>

        <button type="button" class="create-memory-btn" id="createMemoryBtn">＋ 开始新创作</button>

        <div class="memory-list-wrapper">
          <div class="memory-list" id="memoryList"></div>
        </div>
      </aside>

      <section class="welcome-panel" id="welcomePanel">
        <div class="floating-orbs" aria-hidden="true">
          <span class="orb orb-one"></span>
          <span class="orb orb-two"></span>
          <span class="orb orb-three"></span>
          <span class="orb orb-four"></span>
        </div>
        <div class="welcome-copy">
          <h1 class="hero-title">欢迎来到 叙构</h1>
          <p>
            在这里，将章节的叙事转变为可编辑的剧本结构。<br>
            <span class="hero-subline">您可以加载示例、上传原文，开始您的创作之旅。</span>
          </p>
          <button type="button" class="start-button" id="startCreateBtn">开始创作 →</button>
        </div>

        <footer class="welcome-footer">叙构 ©2026 • 隐私政策 • 使用条款 • 服务协议</footer>
      </section>
    </main>
  </div>

  <script src="app.js?v=20260607c"></script>
</body>
</html>
